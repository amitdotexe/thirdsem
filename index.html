<!DOCTYPE html>

<style>
:root{--cream:#FFFDF2;--black:#000000;--line:rgba(0,0,0,.16);--soft:rgba(0,0,0,.06);--side:260px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--cream);color:var(--black);font:16px/1.6 Georgia,"Iowan Old Style","Times New Roman",serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.app{display:flex;height:100%}
aside{width:var(--side);flex:none;border-right:2px solid var(--black);display:flex;flex-direction:column;background:var(--cream);overflow-y:auto}
.brand{padding:26px 22px 18px;font-size:23px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.brand small{display:block;margin-top:6px;font-size:13px;font-weight:400;opacity:.65}
nav{padding:6px 12px 20px;display:flex;flex-direction:column;gap:3px}
nav button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:10px;cursor:pointer;font-size:16px}
nav button span{font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
nav button:hover{background:var(--soft)}
nav button[aria-current="true"]{background:var(--black);color:var(--cream)}
main{flex:1;min-width:0;overflow-y:auto}
.wrap{max-width:780px;margin:0 auto;padding:40px 32px 90px}
.head{display:flex;align-items:center;gap:16px}
.menu{flex:none;display:inline-flex;background:transparent;color:var(--black);border:2px solid var(--black);border-radius:8px;padding:9px;cursor:pointer}
.menu:hover{background:var(--black);color:var(--cream)}
.menu svg{display:block}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0}
.sub{margin:10px 0 24px;opacity:.7}
.seg{display:inline-flex;border:2px solid var(--black);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 22px;cursor:pointer;font-size:16px}
.seg button+button{border-left:2px solid var(--black)}
.seg button[aria-pressed="true"]{background:var(--black);color:var(--cream)}
h2{font-size:19px;margin:34px 0 0;padding-bottom:8px;border-bottom:2px solid var(--black)}
.q{border-bottom:1px solid var(--line);padding:20px 0}
.qh{display:flex;gap:14px}
.n{flex:none;width:2.2em;font-weight:700;font-variant-numeric:tabular-nums}
.qt{flex:1;min-width:0}
.qt p{margin:0 0 8px}
.qt .ttl{font-weight:700}
.qt ol,.qt ul{margin:6px 0 10px;padding-left:1.3em}
.qt li{margin:2px 0}
.tag{display:inline-block;border:1px solid var(--black);border-radius:4px;padding:0 8px;font-size:13px;margin-right:6px}
.tag.f{background:var(--black);color:var(--cream)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--soft);padding:1px 5px;border-radius:3px}
pre{margin:8px 0;padding:10px 12px;background:var(--soft);border-left:3px solid var(--black);overflow-x:auto;font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.note{margin:18px 0 0;opacity:.75;font-size:15px}
.scrim{display:none}
.brand{position:relative}
@media(min-width:821px){body.collapsed aside{display:none}}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:8px 14px 8px 0}
th{border-bottom:2px solid var(--black)}
td:first-child{font-weight:700;white-space:nowrap}
@media(max-width:820px){
 aside{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px)}
 body.nav aside{transform:none}
 body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}

 .wrap{padding:20px 18px 80px}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
.tk{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tk input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:2px 0 0;border:2px solid var(--black);border-radius:5px;background:transparent;cursor:pointer;display:grid;place-content:center}
.tk input:checked{background:var(--black)}
.tk input:checked::after{content:"";width:6px;height:11px;border:solid var(--cream);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tk.done .tx{opacity:.5;text-decoration:line-through}
h2 .cnt{float:right;font-size:14px;font-weight:400;opacity:.7}
</style>

 notes:[
 {t:"1. File opening modes",p:"Pass modes as the second argument to `open()` or the stream constructor and combine them with `|`. Defaults: `ifstream` uses `ios::in`, `ofstream` uses `ios::out`.",rows:[["Mode","Meaning"],["ios::in","Open for reading. The file must already exist."],["ios::out","Open for writing. Creates the file if missing and erases existing contents (same as `ios::out | ios::trunc`)."],["ios::app","Append. Every write goes to the end, even if you seek elsewhere. Existing data is kept and the file is created if missing."],["ios::ate","Jump to the end when opening, but you may seek and write anywhere afterwards. Does not erase anything by itself."],["ios::trunc","Discard existing contents on opening. Implied by `ios::out` unless `ios::in` or `ios::app` is also given."],["ios::binary","Raw bytes with no newline translation. Use with `read()` and `write()` for fixed-size records."]],c:`ofstream a("log.txt", ios::app);   // add to the end, keep old data
ofstream b("log.txt");              // erase and start fresh
fstream  c("t.dat", ios::in | ios::out | ios::binary);  // read and update records
fstream  d("log.txt", ios::in | ios::out | ios::ate);   // start at end, keep data`,n:"app vs ate: with `app` all writes are forced to the end. With `ate` only the starting position is the end, so you can still seek back and overwrite."},
 {t:"2. seekg(), seekp(), tellg() and tellp()",p:"A file stream keeps a get pointer (next byte to read) and a put pointer (next byte to write). Positions are byte offsets from the start of the file.",rows:[["Function","Purpose"],["tellg()","Returns the current position of the get (read) pointer."],["tellp()","Returns the current position of the put (write) pointer."],["seekg(pos)","Moves the get pointer to an absolute byte position."],["seekg(off, dir)","Moves the get pointer `off` bytes relative to `dir`."],["seekp(pos), seekp(off, dir)","Same as seekg, but for the put pointer."]],c:`fstream f("tickets.dat", ios::in | ios::out | ios::binary);
f.seekg(0, ios::end);
long size = f.tellg();                  // file size in bytes
int n = size / sizeof(Ticket);          // number of records

Ticket t;
f.seekg(2 * sizeof(Ticket), ios::beg);  // third record
f.read((char*)&t, sizeof t);

t.fare += 50;
f.seekp(2 * sizeof(Ticket), ios::beg);  // go back and overwrite it
f.write((char*)&t, sizeof t);`,n:"Record n starts at (n - 1) * sizeof(record). For an fstream, call seekg before reading and seekp before writing when you switch between the two. If a read hit the end of file, call `clear()` first, otherwise the seek may fail."},
 {t:"3. Seek directions: ios::beg, ios::cur, ios::end",rows:[["Direction","Offset is measured from"],["ios::beg","The beginning of the file. Offset must be zero or positive."],["ios::cur","The current pointer position. Offset may be positive or negative."],["ios::end","The end of the file. Offset is usually zero or negative."]],c:`f.seekg(0, ios::beg);     // start of file
f.seekg(5, ios::cur);     // skip 5 bytes forward
f.seekg(-10, ios::end);   // 10 bytes before the end
f.seekg(0, ios::end);     // at the end, so tellg() gives the file size`},
 {t:"4. State functions: is_open(), good(), fail(), bad(), eof(), clear()",rows:[["Function","Purpose"],["is_open()","True if the file was opened successfully. Check it right after `open()`."],["good()","True only when no error flag is set."],["fail()","True if failbit or badbit is set: a failed operation such as a wrong-format read."],["bad()","True if badbit is set: a serious stream error."],["eof()","True if eofbit is set: a read tried to go past the end of the file."],["clear()","Resets the state flags to good so the stream can be used again. `clear(state)` sets a specific state."]],c:`ifstream f("salary.txt");
if (!f.is_open()) { cout << "Cannot open file"; return 1; }

int id; double sal, total = 0;
int valid = 0, invalid = 0;
while (!f.eof()) {
    if (f >> id >> sal) { valid++; total += sal; }
    else if (!f.eof()) {            // bad record, not the end
        f.clear();                  // reset the error state
        f.ignore(1000, '\\n');       // skip the rest of the line
        invalid++;
    }
}`,n:"Do not write `while(!f.eof())` with a read inside and no check: eof() becomes true only after a read fails, so the last record is often processed twice. Checking the read itself, as above, avoids this."},
 {t:"5. failbit vs badbit vs eofbit",rows:[["Flag","Set when","Test with","Recoverable?"],["eofbit","A read reaches the end of the file.","eof()","Yes. clear() resets it."],["failbit","An operation fails but the stream is intact: wrong format (letters into an int), nothing extracted, or a read past the end.","fail()","Yes. clear(), then discard the bad input."],["badbit","A serious error or loss of stream integrity, such as a read or write failure.","bad()","Usually not. Stop processing."]],n:"fail() is true if failbit or badbit is set. Reading past the end sets eofbit and failbit together. good() is true only when none of the three is set."}
 ],
 qunits:["Unit 1: Working with Files","Unit 2: Exception Handling","Unit 3: Templates","Unit 4: Advanced OOP – STL","Additional output-prediction questions"],
 qb1:[
 {u:0,t:"File Stream Classes and File Operations",th:"Explain the different file stream classes available in C++, including `ifstream`, `ofstream` and `fstream`. Draw their inheritance hierarchy and explain the role of their base classes. What are the different methods of opening a file? Differentiate between opening a file through a constructor and using the `open()` member function. Why is it important to close a file after completing file operations?",st:"Student Examination Records",i:"A university maintains examination records in a file named `results.txt`. Write a C++ program that:",r:["Accepts the roll number, student name and marks in three subjects for n students.","Calculates the total and average marks of each student.","Stores all student records in `results.txt` using `ofstream`.","Closes the file and reopens it using `ifstream`.","Displays the details of students whose average marks are above 80.","Displays the total number of students stored in the file."]},
 {u:0,t:"File Opening Modes",th:"Explain the different file opening modes supported by C++, including `ios::in`, `ios::out`, `ios::app`, `ios::ate`, `ios::trunc` and `ios::binary`. How can multiple opening modes be combined? Differentiate between `ios::app` and `ios::ate` with suitable examples. Explain what happens when an existing file is opened using `ios::out`.",st:"Bank Transaction History",i:"A bank maintains a transaction history in `transactions.txt`. Write a menu-driven C++ program that:",r:["Creates a new transaction file by removing previously stored data.","Adds new transaction details (account number, transaction type and amount) without deleting existing records.","Opens the file in reading mode and displays all transactions.","Calculates and displays the total deposited and withdrawn amounts.","Allows the user to add multiple transactions during execution.","Mention the appropriate file opening mode for every operation."]},
 {u:0,t:"File Pointers and Random Access",th:"What are file pointers in C++? Explain the difference between get and put pointers. Describe the working of `seekg()`, `seekp()`, `tellg()` and `tellp()` with suitable examples. Explain the significance of `ios::beg`, `ios::cur` and `ios::end`. How does random access differ from sequential file access?",st:"Library Book Database",i:"A library stores book records in a binary file `books.dat`. Each record contains a book ID, title and price. Write a C++ program that:",r:["Stores multiple book records in the binary file using `write()`.","Uses `tellg()` to calculate the total number of records.","Retrieves a particular book record using its position without reading all previous records.","Updates the price of a given book directly using `seekp()`.","Displays the updated record using `seekg()`.","Use `ios::in | ios::out | ios::binary` wherever appropriate."]},
 {u:0,t:"Error Handling During File Operations",th:"Explain the different stream error states in C++. Discuss the purpose of `is_open()`, `good()`, `fail()`, `bad()`, `eof()` and `clear()`. Differentiate between `failbit`, `badbit` and `eofbit`. Under what circumstances does a stream enter an error state, and how can it be recovered?",st:"Inventory Data Validation",i:"A warehouse maintains product information in `inventory.txt`, containing product ID, product name and quantity. Some records may contain invalid quantities. Write a C++ program that:",r:["Checks whether the file has opened successfully before processing.","Reads product records one by one.","Detects invalid or non-numeric quantities using `fail()`.","Uses `clear()` to reset the stream error state.","Skips the invalid record and continues processing subsequent records.","Displays the number of valid and invalid records.","Calculates the total quantity of all valid products."]},
 {u:0,t:"Command-Line Arguments",th:"What are command-line arguments in C++? Explain the purpose of `argc` and `argv[]` in the `main()` function. How are arguments passed to a program during execution? Explain how a program can validate the number and type of arguments supplied by the user. What should happen when incorrect arguments are provided?",st:"File Comparison Utility",i:"Develop a command-line utility named `compare` that executes as `compare file1.txt file2.txt`. The program should:",r:["Verify that exactly two filenames have been supplied.","Display an appropriate usage message if the arguments are incorrect.","Open both files and report an error if either file does not exist.","Compare both files character by character.","Identify whether the files are identical.","If they differ, display the position of the first mismatching character.","Display the total number of characters in each file."]},
 {u:1,t:"Exception Handling and Multiple Catch Blocks",th:"What is an exception in C++? Explain the mechanism of exception handling using `try`, `throw` and `catch`. Why is exception handling preferred over traditional error-handling techniques? Explain how multiple catch blocks are used to handle different exception types. What is the purpose of the catch-all handler `catch(...)`? Why should it generally be placed after specific catch blocks?",st:"Online Shopping Cart",i:"An online shopping platform allows customers to purchase products. Write a C++ program that processes five purchase requests. Create a function `purchase(int quantity, double price)` that throws:",g:[{r:["An integer exception if the quantity is zero or negative.","A string exception if the quantity exceeds 50.","A double exception if the total purchase amount exceeds the customer’s available balance."]},{i:"In `main()`:",r:["Process five different purchase requests.","Handle each exception type using separate catch blocks.","Include a catch-all handler.","Display the final remaining balance.","Demonstrate that the program continues execution after an exception."]}]},
 {u:1,t:"Standard Exceptions, Rethrowing and Custom Exceptions",th:"Explain exception rethrowing in C++. What is stack unwinding? Describe the hierarchy of standard exception classes, including `exception`, `logic_error`, `runtime_error`, `out_of_range`, `invalid_argument` and `bad_alloc`. How can a user-defined exception class be created by inheriting from `std::exception`? Explain the purpose of overriding the `what()` function.",st:"University Fee Management System",i:"A university maintains student fee balances in a vector. Write a C++ program that:",r:["Defines a custom exception class `InsufficientBalance`, derived from `std::exception`.","Overrides `what()` to return an appropriate error message.","Implements a function `payFee(int studentIndex, double amount)`.","Uses `vector::at()` to detect invalid student indices.","Throws `InsufficientBalance` if the available balance is insufficient.","Catches exceptions inside `payFee()`, displays `Payment Failed – Transaction Rolled Back` and rethrows them.","Handles the exceptions in `main()` using `catch(const exception& e)`.","Displays the updated balances after all transactions."]},

 {s:0,src:"Dec 2025 · Q6",t:"Virtual inheritance, constructor order and polymorphism",n:"Predict the complete output. Pay attention to constructor calls, destructor calls, virtual functions, and object slicing.",c:`#include <iostream>
using namespace std;
class A {
public:
    int x = 100;
    A() { cout << "[A-constructed] "; }
    virtual void show() { cout << "A::show{" << x << "} "; }
    ~A() { cout << "[A-destructed] "; }
};
class B : virtual public A {
public:
    int x = 200;
    B() { cout << "[B-constructed] "; }
    void show() override { cout << "B::show{" << x << "} "; }
    ~B() { cout << "[B-destructed] "; }
};
class C : virtual public A {
public:
    int x = 300;
    C() { cout << "[C-constructed] "; }
    void show() override { cout << "C::show{" << x << "} "; }
    ~C() { cout << "[C-destructed] "; }
};
class D : public B, public C {
public:
    int x = 400;
    D() { cout << "[D-constructed] "; }
    void show() override { cout << "D::show{" << x << "} "; }
    ~D() { cout << "[D-destructed] "; }
};
void display(A obj) {
    obj.show();
}
int main() {
    D d;
    A *p = &d;
    p->show();
    display(d);
    cout << d.B::x << " " << d.C::x << " ";
    return 0;
}`},

 name:"DSA",
 tabs:["topics"],
 chapters:[
 {name:"Chapter 1: BST",items:[
  "Inorder, preorder, postorder traversal (recursive and non-recursive using stack)",
  "Level order traversal",
  "Height of a tree",
  "BST operations: search, min, max, predecessor, successor, insert, delete",
  "Retrieval in sorted order (inorder traversal)",
  "Sorting using BST"]},
 {name:"Chapter 2: AVL Tree",items:[
  "Balance factor and rotations (LL, RR, LR, RL)",
  "AVL insert",
  "AVL delete"]},
 {name:"Chapter 3: Threaded Binary Tree",items:[
  "Threaded tree traversal"]},
 {name:"Chapter 4: Heap",items:[
  "Percolate down",
  "Percolate up"]},
 {name:"Chapter 5: Graph",items:[
  "Insert vertex and edge",
  "Graph coloring",
  "BFS (recursive and non-recursive)",
  "DFS (iterative)",
  "Kruskal's algorithm",
  "Prim's algorithm",
  "Dijkstra's algorithm",
  "Kahn's algorithm",
  "Bellman-Ford algorithm",
  "Floyd-Warshall algorithm"]}
 ]

const TABS = {code:"Code",theory:"Theory",output:"Output",num:"Numericals",notes:"Notes",qb1:"Question Bank 1",topics:"Topics"};
let cur = 0, kind = null;
let DONE = {};
try{ DONE = JSON.parse(localStorage.getItem("qb-done")||"{}"); }catch(e){}
function saveDone(){ try{ localStorage.setItem("qb-done", JSON.stringify(DONE)); }catch(e){} }
function topicSub(s){
  const all = s.chapters.reduce((a,c)=>a+c.items.length,0);
  const d = s.chapters.reduce((a,c)=>a+c.items.filter(t=>DONE[s.name+"|"+t]).length,0);
  return all+" topics · "+d+" done";
}
function buildSeg(){
  const t = BANK[cur].tabs || ["code","theory","output","notes","qb1"];
  if(!t.includes(kind)) kind = t[0];
  $("seg").innerHTML = t.map(k=>`<button data-k="${k}" aria-pressed="${k===kind}">${TABS[k]}</button>`).join("");
}
const $ = id => document.getElementById(id);
const fmt = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/`([^`]+)`/g, "<code>$1</code>");

function buildNav(){
  $("nav").innerHTML = BANK.map((s,i)=>
    `<button data-i="${i}" aria-current="${i===cur}">${s.name}<span>${(s.code||[]).length + (s.theory||[]).length + (s.output||[]).length + (s.num||[]).length + (s.qb1||[]).length + (s.chapters||[]).reduce((a,c)=>a+c.items.length,0)}</span></button>`).join("");
}
function row(n, body){ return `<article class="q"><div class="qh"><div class="n">${n}.</div><div class="qt">${body}</div></div></article>`; }
function render(){
  const s = BANK[cur];
  $("title").textContent = s.name;
  $("sub").textContent = kind==="topics" ? topicSub(s) : kind==="qb1" ? "10 long-answer questions (theory + scenario) and 5 output-prediction questions" : kind==="notes" ? s.notes.length + " quick-reference notes on file handling" : (s[kind]||[]).length + " " + ({code:"coding",theory:"theory",output:"output-prediction",num:"numerical"}[kind]) + " questions";
  let h = "", last = -1;
  if(kind==="code"){
    s.code.forEach((x,i)=>{
      if(x.s!==last){ last=x.s; h += `<h2>${s.sections[x.s]}</h2>`; }
      h += row(i+1, `<p class="ttl">${fmt(x.t)}</p><p><span class="tag">${x.m} marks</span></p>` +
        (x.i?`<p>${fmt(x.i)}</p>`:"") + `<ol>${x.r.map(r=>`<li>${fmt(r)}</li>`).join("")}</ol>`);
    });
  } else if(kind==="qb1"){
    s.qb1.forEach((x,i)=>{
      if(x.u!==last){ last=x.u; h += `<h2>${s.qunits[x.u]}</h2>`; }
      let b = `<p class="ttl">${fmt(x.t)}</p>`;
      if(x.c){ b += (x.n?`<p>${fmt(x.n)}</p>`:"") + `<pre>${fmt(x.c)}</pre>`; }
      else {
        b += `<p><strong>Theory.</strong> ${fmt(x.th)}</p>` + (x.l?`<ol>${x.l.map(r=>`<li>${fmt(r)}</li>`).join("")}</ol>`:"") + (x.th2?`<p>${fmt(x.th2)}</p>`:"") + `<p><strong>Scenario: ${fmt(x.st)}</strong></p>` + (x.i?`<p>${fmt(x.i)}</p>`:"");
        (x.g||[{r:x.r}]).forEach(g=>{ b += (g.h?`<p><strong>${fmt(g.h)}</strong></p>`:"") + (g.i?`<p>${fmt(g.i)}</p>`:"") + (g.r?`<ul>${g.r.map(r=>`<li>${fmt(r)}</li>`).join("")}</ul>`:""); });
      }
      h += row(i+1, b);
    });
  } else if(kind==="topics"){
    s.chapters.forEach((c,ci)=>{
      const d = c.items.filter(t=>DONE[s.name+"|"+t]).length;
      h += `<h2>${fmt(c.name)}<span class="cnt" id="cnt${ci}">${d}/${c.items.length}</span></h2>`;
      c.items.forEach(t=>{
        const k = s.name+"|"+t, on = !!DONE[k];
        h += `<label class="tk${on?" done":""}"><input type="checkbox" data-k="${k}" data-c="${ci}"${on?" checked":""}><span class="tx">${fmt(t)}</span></label>`;
      });
    });
  } else if(kind==="notes"){
    s.notes.forEach(x=>{
      h += `<h2>${fmt(x.t)}</h2>` + (x.p?`<p>${fmt(x.p)}</p>`:"") + (x.rows?`<div class="tw"><table><tr>${x.rows[0].map(c=>`<th>${fmt(c)}</th>`).join("")}</tr>${x.rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</table></div>`:"") + (x.c?`<pre>${fmt(x.c)}</pre>`:"") + (x.n?`<p>${fmt(x.n)}</p>`:"");
    });
  } else if(kind==="num"){
    s.num.forEach((x,i)=>{
      if(x.s!==last){ last=x.s; h += `<h2>${s.nsections[x.s]}</h2>`; }
      h += row(i+1, `<p class="ttl">${fmt(x.t)}</p><p><span class="tag${x.src==="Predicted"?"":" f"}">${x.src}</span><span class="tag">${x.k}</span>${x.m?`<span class="tag">${x.m} marks</span>`:""}</p><p>${fmt(x.q)}</p>` + (x.c?`<pre>${fmt(x.c)}</pre>`:"") + (x.r?`<ol type="i">${x.r.map(r=>`<li>${fmt(r)}</li>`).join("")}</ol>`:""));
    });
  } else if(kind==="output"){
    s.output.forEach((x,i)=>{
      if(x.s!==last){ last=x.s; h += `<h2>${s.osections[x.s]}</h2>`; }
      h += row(i+1, `<p class="ttl">${fmt(x.t)}</p><p><span class="tag${x.src==="Predicted"?"":" f"}">${x.src}</span></p>` + (x.n?`<p>${fmt(x.n)}</p>`:"") + `<pre>${fmt(x.c.trim())}</pre>`);
    });
  } else {
    s.theory.forEach((x,i)=>{
      if(x.s!==undefined && x.s!==last){ last=x.s; h += `<h2>${s.tsections[x.s]}</h2>`; }
      if(x.f && !s.theory[i-1].f) h += `<p class="note">Questions ${i+1}–${s.theory.length}: decide whether each statement is true or false, and justify your answer.</p>`;
      const tags = (x.src?`<span class="tag">${x.src}</span>`:"") + (x.m?`<span class="tag">${x.m} marks</span>`:"") + (x.f?`<span class="tag f">True or false</span>`:"");
      h += row(i+1, `<p>${fmt(x.q)}</p>` + (x.c?`<pre>${fmt(x.c)}</pre>`:"") + (tags?`<p>${tags}</p>`:""));
    });
  }
  $("list").innerHTML = h;
}
function select(i){
  cur = i; kind = null; buildNav(); buildSeg(); render(); $("main").scrollTop = 0;
  document.body.classList.remove("nav");
}
$("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) select(+b.dataset.i); });
document.querySelector(".seg").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  kind=b.dataset.k;
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render(); $("main").scrollTop = 0;
});
const wide = () => matchMedia("(min-width:821px)").matches;
$("menu").addEventListener("click", ()=>{ if(wide()) document.body.classList.toggle("collapsed"); else document.body.classList.toggle("nav"); });

$("list").addEventListener("change", e=>{
  const b = e.target.closest("input[data-k]"); if(!b) return;
  if(b.checked) DONE[b.dataset.k] = 1; else delete DONE[b.dataset.k];
  saveDone();
  b.closest(".tk").classList.toggle("done", b.checked);
  const ci = b.dataset.c, boxes = [...$("list").querySelectorAll('input[data-c="'+ci+'"]')];
  $("cnt"+ci).textContent = boxes.filter(x=>x.checked).length+"/"+boxes.length;
  $("sub").textContent = topicSub(BANK[cur]);
});
$("scrim").addEventListener("click", ()=>document.body.classList.remove("nav"));
buildNav(); buildSeg(); render();
</script>
</body>
</html>
